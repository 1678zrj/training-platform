

server {
    listen 80;
    server_name localhost;

# 1. 增加上传文件大小限制 (AI平台传数据集必须配这个)
    client_max_body_size 1024M;

    # ==========================================
    #  下载/查看功能 (由 Nginx 独挑大梁)
    # ==========================================
    # 访问 http://localhost/media/images/test.jpg
    # 实际读取容器内 /data/media/images/test.jpg
    location /media/ {
        alias /data/media/;  # 对应 Docker 命令中挂载的容器内路径

        autoindex on;             # (可选) 开启后，访问 /media/ 可以看到文件列表
        autoindex_exact_size off; # (可选) 显示人性化的文件大小 (KB/MB)
        autoindex_localtime on;   # (可选) 显示服务器时间

        expires 30d;              # 设置浏览器缓存，提升加载速度
        add_header Access-Control-Allow-Origin *; # 解决跨域图片加载问题
    }


# --- 转发后端 API ---
    location /api/ {
        # 这里的 host.docker.internal 指向宿主机
        proxy_pass http://host.docker.internal:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }




# --- Jupyter 转发 (保持之前的逻辑) ---
    # 1. 核心：配置 Docker 内置 DNS 解析器
    # Docker 容器内部 DNS 固定为 127.0.0.11
    resolver 127.0.0.11 valid=10s;

    # 2. 匹配 /lab/u{user_id}_e{exp_id}/...
    # 正则提取容器名 (container_name)
    location ~ ^/lab/(?<container_name>[\w-]+)/ {

        # 3. 动态代理到容器内部 8888 端口
        # 注意：这里使用变量时，必须有 resolver 支持
        proxy_pass http://$container_name:8888;

        # 标准 WebSocket 和 Header 配置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 增加超时防止 Jupyter 启动慢导致 504
        proxy_connect_timeout 60s;
        proxy_read_timeout 86400s;
    }


}


