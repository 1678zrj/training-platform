	server
	{
		listen       63135;
	    server_name  localhost;
	
	    #charset koi8-r;
	
	    #access_log  logs/host.access.log  main;
	
	    location / {
	        root   'D:/study/real/test';
	        index  index.html index.htm;
	    }
	
	    #error_page  404              /404.html;
	
	    # redirect server error pages to the static page /50x.html
	    #
	    error_page   500 502 503 504  /50x.html;
	    location = /50x.html {
	        root   html;
	    }
	
	}
		server {
				listen 80;
				server_name localhost;
		
				# 【核心魔法】正则匹配：/jupyter-proxy/{端口号}/...
				# (?<target_port>\d+) 表示把匹配到的数字存入变量 $target_port
				location ~ ^/jupyter-proxy/(?<target_port>\d+)(/.*)?$ {
					
					# 1. 代理转发地址
					# Nginx 会解析出 target_port 并拼接地址
					# 注意：这里不需要 rewrite，因为 Jupyter 已经配置了 base_url，
					# 它期望收到的请求就是带 /jupyter-proxy/xxx 的。
					proxy_pass http://127.0.0.1:$target_port;
		
					# 2. WebSocket 必配 (Jupyter 必须)
					proxy_http_version 1.1;
					proxy_set_header Upgrade $http_upgrade;
					proxy_set_header Connection $connection_upgrade;
		
					# 3. 修正 Host 和 Origin，防止 Jupyter 报跨域或 Origin 错误
					proxy_set_header Host $host;
					proxy_set_header X-Real-IP $remote_addr;
					proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
					
					# 4. 增加超时时间（Jupyter 内核启动有时较慢）
					proxy_read_timeout 86400; # 设长一点，防止 websocket 断开
				}
			}

}

